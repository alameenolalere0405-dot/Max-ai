name: MAX AI — CI & Release

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  # ── Tests ──────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0 xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run automated test suite
        run: |
          python tests/test_max.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: logs/

  # ── Code quality ───────────────────────────────────────────────────────
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install pyflakes

      - name: Syntax check all Python files
        run: |
          python -c "
          import ast, os, sys
          errors = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('__pycache__', '.git', 'venv', '.venv')]
              for f in files:
                  if f.endswith('.py'):
                      path = os.path.join(root, f)
                      try:
                          ast.parse(open(path).read())
                      except SyntaxError as e:
                          errors.append(f'{path}: {e}')
                          print(f'SYNTAX ERROR: {path}: {e}')
          if errors:
              sys.exit(1)
          print(f'All Python files OK ({len([f for r,d,fs in os.walk(\".\") for f in fs if f.endswith(\".py\")])} files)')
          "

      - name: Check no secrets in source
        run: |
          # Ensure no API keys are hardcoded
          if grep -r "sk-[a-zA-Z0-9]\{20,\}" --include="*.py" .; then
            echo "ERROR: Possible API key found in source!"
            exit 1
          fi
          echo "Secret scan passed."

  # ── Windows build ──────────────────────────────────────────────────────
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: [test, quality]
    if: github.event_name == 'release'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: python build.py --platform windows
        env:
          BUILD_VERSION: ${{ github.event.release.tag_name }}

      - name: Verify build artifact
        run: |
          if (Test-Path "dist/MAXSetup.exe") {
            Write-Host "Windows build OK: dist/MAXSetup.exe"
            Get-Item "dist/MAXSetup.exe" | Select-Object Length
          } else {
            Write-Error "Build artifact not found!"
            exit 1
          }

      - name: Generate checksum
        run: |
          $hash = Get-FileHash dist/MAXSetup.exe -Algorithm SHA256
          "$($hash.Hash)  MAXSetup.exe" | Out-File dist/MAXSetup.exe.sha256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/MAXSetup.exe
            dist/MAXSetup.exe.sha256

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MAXSetup.exe
            dist/MAXSetup.exe.sha256

  # ── macOS build ────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: [test, quality]
    if: github.event_name == 'release'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS app
        run: python build.py --platform macos
        env:
          BUILD_VERSION: ${{ github.event.release.tag_name }}
          # MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}  # Uncomment when signing is configured

      - name: Verify build
        run: |
          if [ -f "dist/MAX AI.dmg" ]; then
            echo "macOS build OK"
            ls -lh "dist/MAX AI.dmg"
          else
            echo "Build artifact not found!"
            exit 1
          fi

      - name: Generate checksum
        run: |
          shasum -a 256 "dist/MAX AI.dmg" > "dist/MAX AI.dmg.sha256"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/MAX AI.dmg
            dist/MAX AI.dmg.sha256

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MAX AI.dmg
            dist/MAX AI.dmg.sha256

  # ── Linux build ────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-20.04
    needs: [test, quality]
    if: github.event_name == 'release'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libxcb-xinerama0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 fuse

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux AppImage
        run: python build.py --platform linux
        env:
          BUILD_VERSION: ${{ github.event.release.tag_name }}

      - name: Verify build
        run: |
          ls -lh dist/
          if [ -f dist/MAX_AI.AppImage ]; then
            echo "Linux AppImage build OK"
          else
            echo "Build artifact not found!"
            exit 1
          fi

      - name: Generate checksum
        run: shasum -a 256 dist/MAX_AI.AppImage > dist/MAX_AI.AppImage.sha256

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            dist/MAX_AI.AppImage
            dist/MAX_AI.AppImage.sha256

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MAX_AI.AppImage
            dist/MAX_AI.AppImage.sha256

  # ── Release summary ────────────────────────────────────────────────────
  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    if: github.event_name == 'release'

    steps:
      - name: Release complete
        run: |
          echo "MAX AI ${{ github.event.release.tag_name }} release artifacts published."
          echo "LEREON Technologies — MAX AI © 2026"
